<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>REC Diagnostics</title>
<style>
  body{font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#0b0b0b;color:#39ff14;padding:18px;margin:0}
  h2{color:#fff;margin:0 0 12px}
  pre{white-space:pre-wrap;word-break:break-word;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:14px;max-width:100%;overflow:auto}
  .ok{color:#39ff14}.bad{color:#ff5555}.warn{color:#ffcc44}
</style>
</head>
<body>
<h2>REC Diagnostics <span style="font-size:12px;color:#888">(standalone)</span></h2>
<pre id="log">starting…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var log = document.getElementById("log");
  function out(m) { log.textContent += "\n" + m; }
  function reset(m){ log.textContent = m; }
  window.onerror = function (m, s, l, c) { out("WINDOW ERROR: " + m + " @" + l + ":" + c); };
  window.addEventListener("unhandledrejection", function (e) {
    out("REJECTION: " + ((e.reason && e.reason.message) || e.reason));
  });

  reset("build=diag-2  time=" + new Date().toISOString());
  out("location: " + location.href);
  out("UA: " + navigator.userAgent);
  out("supabase global loaded: " + (typeof supabase));
  try {
    var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf("sb-") === 0 || k.indexOf("rec_") === 0; });
    out("localStorage session keys: " + (keys.length ? keys.join(", ") : "(none)"));
    keys.forEach(function (k) {
      try { var v = JSON.parse(localStorage.getItem(k)); out("  " + k + " => keys: " + (v && typeof v === "object" ? Object.keys(v).slice(0, 6).join(",") : String(v).slice(0, 40))); } catch (e) {}
    });
  } catch (e) { out("localStorage read failed: " + e.message); }

  var URL_ = "https://iyyxbvfqrfvdatkfvtyx.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eXhidmZxcmZ2ZGF0a2Z2dHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQxNDQsImV4cCI6MjEwNTc1MDE0NH0.xBqeJY3QoRlSJYL6J8-EocvZGLn5eaMulMl97aO9nFY";

  if (typeof supabase === "undefined") {
    out("FATAL: supabase CDN did not load. The browser could not reach cdn.jsdelivr.net.");
    return;
  }

  var c;
  try { c = supabase.createClient(URL_, KEY); out("client created OK"); }
  catch (e) { out("createClient EXC: " + e.message); return; }

  function timed(label, fn) {
    var t0 = Date.now();
    out("… " + label);
    var guard = setTimeout(function () { out("HANG: " + label + " still pending after 12s"); }, 12000);
    return fn().then(function (r) {
      clearTimeout(guard);
      out("OK " + label + " (" + (Date.now() - t0) + "ms)");
      return r;
    }).catch(function (e) {
      clearTimeout(guard);
      out("ERR " + label + " (" + (Date.now() - t0) + "ms): " + ((e && e.message) || e));
      return { error: e };
    });
  }

  (async function () {
    var s = await timed("auth.getSession", function () { return c.auth.getSession(); });
    out("  session present: " + !!(s && s.data && s.data.session) + (s && s.data && s.data.session ? " user=" + s.data.session.user.id : ""));

    var pr = await timed("from('products').select(*) limit 5", function () { return c.from("products").select("id,name,price").limit(5); });
    out("  products: error=" + (pr.error ? JSON.stringify(pr.error) : "none") + " rows=" + (pr.data ? pr.data.length : "null"));
    if (pr.data && pr.data.length) out("  sample: " + pr.data.map(function (x) { return x.name; }).join(" | "));

    var pf = await timed("from('profiles').select(*) limit 1", function () { return c.from("profiles").select("*").limit(1); });
    out("  profiles: error=" + (pf.error ? JSON.stringify(pf.error) : "none") + " rows=" + (pf.data ? pf.data.length : "null"));

    var st = await timed("from('site_settings').select(*) limit 1", function () { return c.from("site_settings").select("*").limit(1); });
    out("  site_settings: error=" + (st.error ? JSON.stringify(st.error) : "none") + " rows=" + (st.data ? st.data.length : "null"));

    var ses = (s && s.data && s.data.session) || null;
    if (ses) {
      out("--- admin guard simulation ---");
      out("  user id: " + ses.user.id);
      out("  user email: " + ses.user.email);
      var prof = await timed("profiles own row (guard getProfile)", function () {
        return c.from("profiles").select("*").eq("id", ses.user.id).maybeSingle();
      });
      out("  profile: error=" + (prof.error ? JSON.stringify(prof.error) : "none") +
          " role=" + (prof.data ? prof.data.role : "null") +
          " name=" + (prof.data ? prof.data.full_name : "null"));
      out("  GUARD RESULT: " + (prof.data && prof.data.role === "admin" ? "PASS (admin)" : "FAIL (would redirect to login)"));

      var ord = await timed("dashboard: orders query", function () {
        return c.from("orders").select("id,order_number,status,total,state,created_at,full_name").order("created_at", { ascending: false }).limit(200);
      });
      out("  orders: error=" + (ord.error ? JSON.stringify(ord.error) : "none") + " rows=" + (ord.data ? ord.data.length : "null"));

      var prd = await timed("dashboard: products query", function () {
        return c.from("products").select("id,name,stock_quantity,price,category_id");
      });
      out("  products: error=" + (prd.error ? JSON.stringify(prd.error) : "none") + " rows=" + (prd.data ? prd.data.length : "null"));

      var cst = await timed("dashboard: customers query", function () {
        return c.from("customers").select("id").limit(1000);
      });
      out("  customers: error=" + (cst.error ? JSON.stringify(cst.error) : "none") + " rows=" + (cst.data ? cst.data.length : "null"));
    }

    out("=== DONE ===");
  })();
})();
</script>
</body>
</html>
