<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | REC Admin</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="../assets/logo/rec-logo.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
  <div id="admin-shell" data-page="dashboard">
  </div>

  
  
      
  
  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/app.js?v=2026-10-09.3"></script>
  <script>
  (function () {
    function report() {
      var c = document.getElementById("admin-content");
      var shell = document.getElementById("admin-shell");
      var s = document.querySelector('script[src*="app.js"]');
      var panel = document.createElement("div");
      panel.id = "inline-diag";
      panel.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:2147483647;background:#001a1a;color:#00ffff;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;max-width:92vw;white-space:pre-wrap;border-radius:6px";
      panel.textContent =
        "INLINE DIAG\n" +
        "scriptSrc=" + (s ? s.src : "none") + "\n" +
        "REC_LOADED=" + !!window.REC_LOADED + " AdminPage=" + (window.AdminPage ? "yes" : "no") + "\n" +
        "shellChildren=" + (shell ? shell.children.length : "no-shell") + "\n" +
        "contentExists=" + !!c + " htmlLen=" + (c ? c.innerHTML.length : "n/a") + "\n" +
        "text=" + JSON.stringify((c ? c.textContent : "").replace(/\s+/g, " ").trim().slice(0, 160));
      document.body.appendChild(panel);
    }
    window.addEventListener("load", function () { setTimeout(report, 3500); });
  })();
  </script>
</body>
</html>
